# Selenoid stack for local development and running tests from ./tests
#
# Prerequisite: the Dockerfile expects a prebuilt linux binary in dist/:
#   GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/selenoid_linux_amd64 .
#
# Usage:
#   docker compose up -d --build
#   docker compose down
services:
  selenoid:
    build: .
    image: selenoid:latest
    container_name: selenoid
    ports:
      - "4444:4444"
    environment:
      # Sibling video-recorder containers resolve bind sources on the Docker
      # daemon host, so the video directory must be mounted at the SAME host
      # path they are configured with (OVERRIDE_VIDEO_OUTPUT_DIR).
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./browsers.json:/etc/selenoid/browsers.json:ro
      - /opt/selenoid/video:/opt/selenoid/video
      - /opt/selenoid/logs:/opt/selenoid/logs
    entrypoint:
      [
        "/usr/bin/selenoid",
        "-listen",
        ":4444",
        "-conf",
        "/etc/selenoid/browsers.json",
        "-video-output-dir",
        "/opt/selenoid/video/",
        "-log-output-dir",
        "/opt/selenoid/logs/",
        "-container-network",
        "selenoid-net",
        "-limit",
        "5",
      ]
    networks:
      - selenoid-net

networks:
  selenoid-net:
    name: selenoid-net
    driver: bridge
