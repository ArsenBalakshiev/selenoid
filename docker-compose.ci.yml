# CI-only compose: self-contained variant of docker-compose.yml for runners
# whose docker daemon does not share the job workspace filesystem
# (docker-in-docker style setups make ./browsers.json file binds resolve to
# directories inside the container). The config is copied into the container
# explicitly from the workflow (docker cp + restart).
services:
  selenoid:
    build: .
    image: selenoid:latest
    container_name: selenoid
    ports:
      - "4444:4444"
    environment:
      # Sibling video-recorder containers resolve bind sources on the Docker
      # daemon host, so the video directory must be mounted at the SAME host
      # path they are configured with (OVERRIDE_VIDEO_OUTPUT_DIR).
      - OVERRIDE_VIDEO_OUTPUT_DIR=/opt/selenoid/video
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/selenoid/video:/opt/selenoid/video
      - /opt/selenoid/logs:/opt/selenoid/logs
    entrypoint:
      [
        "/usr/bin/selenoid",
        "-listen",
        ":4444",
        "-conf",
        "/etc/selenoid/browsers.json",
        "-video-output-dir",
        "/opt/selenoid/video/",
        "-log-output-dir",
        "/opt/selenoid/logs/",
        "-container-network",
        "selenoid-net",
        "-limit",
        "5",
      ]
    networks:
      - selenoid-net

networks:
  selenoid-net:
    name: selenoid-net
    driver: bridge
