version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # Log writers and optional closers are allowed to fail silently.
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - (*os.File).Close
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
